name: IndexNow

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Submit sitemap URLs to IndexNow
        run: |
          python3 << 'PY'
          import json
          import time
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET

          sitemap_url = "https://littlesquirtgun-byte.github.io/tawleed-seo/sitemap.xml"
          key = "ef85fa606b4c425646cf566737297228"
          key_location = "https://littlesquirtgun-byte.github.io/tawleed-seo/ef85fa606b4c425646cf566737297228.txt"
          host = "littlesquirtgun-byte.github.io"
          endpoint = "https://api.indexnow.org/indexnow"
          required = [
              "https://littlesquirtgun-byte.github.io/tawleed-seo/forever-world/",
              "https://littlesquirtgun-byte.github.io/tawleed-seo/beauty-in-simplicity/",
          ]

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "tawleed-seo-indexnow"})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return resp.status, resp.read()

          def fetch_retry(url, attempts=6, delay=10):
              last = None
              for i in range(attempts):
                  try:
                      return fetch(url)
                  except Exception as exc:
                      last = exc
                      print(f"fetch failed ({i + 1}/{attempts}): {url} {exc}")
                      time.sleep(delay)
              raise SystemExit(f"giving up on {url}: {last}")

          _, key_body = fetch_retry(key_location)
          key_text = key_body.decode("utf-8").strip()
          if key_text != key:
              raise SystemExit(f"keyLocation body mismatch: {key_text!r}")

          _, sitemap_body = fetch_retry(sitemap_url)
          root = ET.fromstring(sitemap_body)
          urls = []
          seen = set()
          for el in root.iter():
              if not el.tag.endswith("loc") or not el.text:
                  continue
              loc = el.text.strip()
              if not loc.startswith(f"https://{host}/"):
                  continue
              if loc in seen:
                  continue
              seen.add(loc)
              urls.append(loc)

          missing = [url for url in required if url not in urls]
          if not urls or missing:
              raise SystemExit(f"sitemap missing required urls: {missing or 'empty sitemap'}")

          payload = {
              "host": host,
              "key": key,
              "keyLocation": key_location,
              "urlList": urls,
          }
          print(json.dumps(payload, indent=2))
          req = urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print("IndexNow", resp.status)
                  print(resp.read().decode("utf-8", "replace"))
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode("utf-8", "replace")
              print("IndexNow error", exc.code, detail)
              raise SystemExit(1)
          PY
